# SmartChrono IP — Docker Compose
# Spec: punt 2.2, 2.6, 2.8, 2.14
# Ticket: PJM-14

# ─── Política de logs (punt 2.6) ────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

# ─── Xarxes (punt 2.8) ──────────────────────────────────────────────────────
networks:
  sc-frontend-net:
    driver: bridge

  sc-backend-net:
    driver: bridge
    internal: true

  sc-ai-net:
    driver: bridge
    internal: true

  sc-observability-net:
    driver: bridge
    internal: true

# ─── Volums persistents ──────────────────────────────────────────────────────
volumes:
  sc-mongodb-data:
  sc-redis-data:
  sc-minio-data:
  sc-grafana-data:
  sc-prometheus-data:
  sc-label-studio-data:

# ─── Serveis ─────────────────────────────────────────────────────────────────
services:

  # ── Grup 1: Infraestructura base ─────────────────────────────────────────

  sc-mongodb:
    image: mongo:8
    restart: unless-stopped
    env_file: ./services/sc-mongodb/.env
    volumes:
      - sc-mongodb-data:/data/db
      - ./services/sc-mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sc-backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  sc-redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ./services/sc-redis/.env
    command: >
      sh -c "redis-server $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"
    volumes:
      - sc-redis-data:/data
    networks:
      - sc-backend-net
      - sc-ai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  sc-object-storage:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    env_file: ./services/sc-object-storage/.env
    command: server /data --console-address ":9001"
    volumes:
      - sc-minio-data:/data
    ports:
      - "9000:9000"   # S3 API (opcional, per gestió directa)
      - "9001:9001"   # MinIO Console
    networks:
      - sc-backend-net
      - sc-ai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  sc-minio-init:
    image: minio/mc:latest
    container_name: sc-minio-init
    depends_on:
      sc-object-storage:
        condition: service_healthy
    volumes:
      - ./services/sc-object-storage/init:/init:ro
    env_file:
      - ./services/sc-object-storage/.env
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    networks:
      - sc-backend-net
    restart: "no"
    logging: *default-logging

  # ── Grup 2: API Gateway ───────────────────────────────────────────────────

  sc-api-gateway:
    build:
      context: ./services/sc-api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./services/sc-api-gateway/.env
    ports:
      - "8000:8000"
    networks:
      - sc-frontend-net
      - sc-backend-net
    depends_on:
      sc-mongodb:
        condition: service_healthy
      sc-redis:
        condition: service_healthy
      sc-object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── Grup 3: Workers ───────────────────────────────────────────────────────

  sc-video-manager:
    build:
      context: ./services/sc-video-manager
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./services/sc-video-manager/.env
    networks:
      - sc-backend-net
    depends_on:
      sc-redis:
        condition: service_healthy
      sc-object-storage:
        condition: service_healthy
    logging: *default-logging

  sc-logic-aggregator:
    build:
      context: ./services/sc-logic-aggregator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./services/sc-logic-aggregator/.env
    networks:
      - sc-backend-net
    depends_on:
      sc-redis:
        condition: service_healthy
      sc-object-storage:
        condition: service_healthy
    logging: *default-logging

  sc-active-learner:
    build:
      context: ./services/sc-active-learner
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./services/sc-active-learner/.env
    networks:
      - sc-backend-net
    depends_on:
      sc-redis:
        condition: service_healthy
      sc-object-storage:
        condition: service_healthy
    logging: *default-logging

  sc-inference-worker:
    build:
      context: ./services/sc-inference-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./services/sc-inference-worker/.env
    networks:
      - sc-ai-net
    depends_on:
      sc-redis:
        condition: service_healthy
      sc-object-storage:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *default-logging

  # ── Grup 4: Frontend ──────────────────────────────────────────────────────

  sc-frontend:
    build:
      context: ./services/sc-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./services/sc-frontend/.env
    ports:
      - "3000:3000"
    networks:
      - sc-frontend-net
    depends_on:
      sc-api-gateway:
        condition: service_healthy
    logging: *default-logging

  # ── Grup 5: Observabilitat ────────────────────────────────────────────────

  sc-prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ./services/sc-prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sc-prometheus-data:/prometheus
    networks:
      - sc-observability-net
    logging: *default-logging

  sc-grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    env_file: ./services/sc-grafana/.env
    volumes:
      - sc-grafana-data:/var/lib/grafana
    ports:
      - "3001:3001"
    networks:
      - sc-observability-net
    logging: *default-logging

  sc-dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8080:8080"
    networks:
      - sc-frontend-net
      - sc-observability-net
    logging: *default-logging

  # ── Servei opcional: Label Studio ─────────────────────────────────────────
  # S'aixeca manualment: docker compose --profile labeling up
  # NO és dependència de cap altre servei (punt 2.8 de l'spec)

  sc-label-studio:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    env_file: ./services/sc-label-studio/.env
    volumes:
      - sc-label-studio-data:/label-studio/data
    ports:
      - "8081:8081"
    networks:
      - sc-frontend-net
      - sc-backend-net
    depends_on:
      sc-object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    profiles:
      - labeling
    logging: *default-logging

  sc-label-studio-init:
    image: python:3.11-slim
    restart: "no"
    env_file: ./services/sc-label-studio/.env
    environment:
      LABEL_STUDIO_URL: http://sc-label-studio:8081
    entrypoint: ["sh", "-c", "pip install requests -q && python3 /init/setup-project.py"]
    volumes:
      - ./services/sc-label-studio/init:/init:ro
    networks:
      - sc-frontend-net
      - sc-backend-net
    depends_on:
      sc-label-studio:
        condition: service_healthy
      sc-object-storage:
        condition: service_healthy
    profiles:
      - labeling
    logging: *default-logging
